<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"SF Pro Display","Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#050505"/><line x1="0" y1="68" x2="1600" y2="68" stroke="#272727" stroke-width="1"/><image x="171" y="19" width="29" height="29" href="data:image/svg+xml;base64,"/><text x="210" y="42" font-size="20" fill="#f7f7f7" font-weight="680" letter-spacing="-0.6">Sloppy</text><text x="347" y="41" font-size="14" fill="#a1a1a1" font-weight="420">Overview</text><text x="457" y="41" font-size="14" fill="#a1a1a1" font-weight="420">Projects</text><text x="563" y="41" font-size="14" fill="#f7f7f7" font-weight="580">Agents</text><rect x="563" y="65" width="44.400000000000006" height="2" rx="0" fill="#f7f7f7"/><text x="661" y="41" font-size="14" fill="#a1a1a1" font-weight="420">Tasks</text><text x="751" y="41" font-size="14" fill="#a1a1a1" font-weight="420">Actors</text><text x="847" y="41" font-size="14" fill="#a1a1a1" font-weight="420">Activity</text><path d="M1232 31h14l-4 4 4 4h-14z" stroke="#727272" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1258" y="41" font-size="13" fill="#727272" font-weight="430">Search</text><rect x="1341" y="17" width="91" height="34" rx="8" fill="#050505" stroke="#333333" stroke-width="1"/><text x="1359" y="39" font-size="13" fill="#f7f7f7" font-weight="560">Dashboard</text><circle cx="1467" cy="34" r="16" fill="#243436"/><circle cx="1467" cy="34" r="12" fill="#0b8f88"/><line x1="0" y1="128" x2="1600" y2="128" stroke="#272727" stroke-width="1"/><text x="174" y="105" font-size="11" fill="#d6d6d6" font-weight="650" letter-spacing="1.1" font-family="SF Mono,monospace">AGENT / YADEV</text><text x="365" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Overview</text><text x="470" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Chat</text><text x="543" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Workers</text><text x="640" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Tasks</text><text x="721" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Skills</text><rect x="799" y="81" width="68" height="32" rx="6" fill="#202020"/><rect x="864" y="81" width="2" height="32" rx="0" fill="#3b82f6"/><text x="810" y="102" font-size="14" fill="#f7f7f7" font-weight="610">Tools</text><text x="891" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Channels</text><text x="996" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Automations</text><text x="1125" y="102" font-size="14" fill="#a1a1a1" font-weight="460">Config</text><text x="175" y="205" font-size="11" fill="#727272" font-weight="650" letter-spacing="1.45" font-family="SF Mono,monospace">AGENTS / YADEV / TOOLS</text><text x="175" y="283" font-size="74" fill="#f7f7f7" font-weight="570" letter-spacing="-3.5">Tools</text><text x="892" y="230" font-size="20" fill="#a1a1a1" font-weight="430">Set the boundaries for what Yadev can do.</text><text x="892" y="259" font-size="20" fill="#a1a1a1" font-weight="430">Policies apply to tool calls across every session.</text><rect x="1265" y="278" width="161" height="38" rx="8" fill="#f7f7f7"/><text x="1282" y="303" font-size="14" fill="#050505" font-weight="590">Save changes  ↗</text><line x1="175" y1="345" x2="1426" y2="345" stroke="#272727" stroke-width="1"/><text x="175" y="389" font-size="14" fill="#f7f7f7" font-weight="580">Policy</text><rect x="175" y="405" width="41" height="2" rx="0" fill="#f7f7f7"/><text x="263" y="389" font-size="14" fill="#a1a1a1" font-weight="440">Permissions</text><text x="393" y="389" font-size="14" fill="#a1a1a1" font-weight="440">Tool catalog</text><text x="529" y="389" font-size="14" fill="#a1a1a1" font-weight="440">Runtime</text><line x1="175" y1="407" x2="1426" y2="407" stroke="#272727" stroke-width="1"/><text x="175" y="454" font-size="22" fill="#f7f7f7" font-weight="570" letter-spacing="-0.4">Policy preset</text><text x="175" y="484" font-size="14" fill="#a1a1a1" font-weight="430">Start from a baseline. Individual tool rules can override it.</text><rect x="1006" y="429" width="420" height="45" rx="7" fill="#050505" stroke="#383838" stroke-width="1"/><text x="1023" y="458" font-size="14" fill="#f7f7f7" font-weight="530">Full access</text><text x="1388" y="458" font-size="19" fill="#a1a1a1" font-weight="400">⌄</text><line x1="175" y1="520" x2="1426" y2="520" stroke="#272727" stroke-width="1"/><text x="175" y="568" font-size="22" fill="#f7f7f7" font-weight="570" letter-spacing="-0.4">Approval policy</text><text x="175" y="598" font-size="14" fill="#a1a1a1" font-weight="430">Choose when a tool call needs a decision.</text><rect x="1006" y="544" width="129" height="44" rx="7" fill="#202020" stroke="#494949" stroke-width="1"/><text x="1022" y="572" font-size="13" fill="#f7f7f7" font-weight="580">Never</text><rect x="1143" y="544" width="137" height="44" rx="7" fill="#050505" stroke="#323232" stroke-width="1"/><text x="1159" y="572" font-size="13" fill="#a1a1a1" font-weight="460">On request</text><rect x="1288" y="544" width="138" height="44" rx="7" fill="#050505" stroke="#323232" stroke-width="1"/><text x="1304" y="572" font-size="13" fill="#a1a1a1" font-weight="460">Approve for me</text><text x="1006" y="617" font-size="12" fill="#727272" font-weight="420">Approval applies before a tool call executes.</text><line x1="175" y1="654" x2="1426" y2="654" stroke="#272727" stroke-width="1"/><text x="175" y="700" font-size="22" fill="#f7f7f7" font-weight="570" letter-spacing="-0.4">Sandbox access</text><text x="175" y="730" font-size="14" fill="#a1a1a1" font-weight="430">Define the filesystem scope available to this agent.</text><rect x="1006" y="676" width="202" height="44" rx="7" fill="#202020" stroke="#494949" stroke-width="1"/><text x="1022" y="704" font-size="13" fill="#f7f7f7" font-weight="580">Workspace only</text><rect x="1216" y="676" width="210" height="44" rx="7" fill="#050505" stroke="#323232" stroke-width="1"/><text x="1232" y="704" font-size="13" fill="#a1a1a1" font-weight="460">Full access</text><text x="1006" y="749" font-size="12" fill="#727272" font-weight="420">The selected scope also applies to command working directories.</text><line x1="175" y1="786" x2="1426" y2="786" stroke="#272727" stroke-width="1"/><text x="175" y="832" font-size="22" fill="#f7f7f7" font-weight="570" letter-spacing="-0.4">Pre-tools hook</text><text x="175" y="862" font-size="14" fill="#a1a1a1" font-weight="430">Check tool calls against a local hook before execution.</text><rect x="1006" y="807" width="420" height="45" rx="7" fill="#050505" stroke="#383838" stroke-width="1"/><text x="1023" y="836" font-size="14" fill="#f7f7f7" font-weight="530">Use global setting</text><text x="1388" y="836" font-size="19" fill="#a1a1a1" font-weight="400">⌄</text><line x1="175" y1="915" x2="1426" y2="915" stroke="#272727" stroke-width="1"/><text x="175" y="951" font-size="12" fill="#727272" font-weight="440">Changes to tool access are recorded in the agent activity log.</text><text x="1330" y="951" font-size="12" fill="#a1a1a1" font-weight="500">View activity  ↗</text></svg>