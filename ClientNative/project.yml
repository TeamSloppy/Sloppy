name: SloppyClient

options:
  bundleIdPrefix: team.sloppy
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    visionOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true

packages:
  SloppyClient:
    path: .
  SloppyComputerControl:
    path: ../Packages/SloppyComputerControl
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.0.0"

targets:
  SloppyClient-macOS:
    type: application
    productName: SloppyClient
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyComputerControl
        product: SloppyComputerControl
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: SupportingFiles/macOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
    entitlements:
      path: SupportingFiles/macOS/SloppyClient.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy

  SloppyClient-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyLiveActivity
      - target: SloppyLiveActivityExtension
        embed: true
    info:
      path: SupportingFiles/iOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SupportingFiles/iOS/SloppyClient-iOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy

  SloppyClient-iPadOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyLiveActivity
      - target: SloppyLiveActivityExtension
        embed: true
    info:
      path: SupportingFiles/iOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SupportingFiles/iOS/SloppyClient-iPadOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy

  SloppyLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyLiveActivityWidget
    dependencies:
      - package: SloppyClient
        product: SloppyLiveActivity
    info:
      path: SupportingFiles/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Sloppy Activity
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client.live-activity
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  SloppyClient-visionOS:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
    info:
      path: SupportingFiles/visionOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SupportingFiles/visionOS/SloppyClient-visionOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-visionOS

  SloppyClient-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: 
      - Sources/SloppyClientWatch
      - sloppy.icon
    info:
      path: SupportingFiles/watchOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client.watchkitapp
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKSupportsAlwaysOnDisplay: true
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-visionOS

schemes:
  SloppyLiveActivityExtension:
    build:
      targets:
        SloppyLiveActivityExtension: all
    analyze:
      config: Debug
    archive:
      config: Release

  SloppyClient-macOS:
    build:
      targets:
        SloppyClient-macOS: all
    run:
      config: Debug
      executable: SloppyClient-macOS
    profile:
      config: Release
      executable: SloppyClient-macOS
    analyze:
      config: Debug
    archive:
      config: Release

  SloppyClient-watchOS:
    build:
      targets:
        SloppyClient-watchOS: all
    run:
      config: Debug
      executable: SloppyClient-watchOS
    profile:
      config: Release
      executable: SloppyClient-watchOS
    analyze:
      config: Debug
    archive:
      config: Release
