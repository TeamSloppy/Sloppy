appId: team.sloppy.client
name: In-place glass address search
---
# Launch the isolated browser at the local first page before this flow.
- launchApp:
    stopApp: false
- assertVisible: Browser First Page
- tapOn: Write a draft
- inputText: Retained search draft
- tapOn:
    id: browser-address
- assertVisible:
    id: browser-search-overlay
- assertVisible:
    id: browser-search-close
- assertNotVisible: Sheet Grabber
- assertNotVisible:
    id: browser-mobile-toolbar
- tapOn: Clear search
- inputText: Find a quiet place
- assertVisible: Suggestions
- tapOn:
    id: browser-search-close
- assertVisible: Retained search draft
- tapOn:
    id: browser-address
- inputText: http://127.0.0.1:18874/second.html
- pressKey: Enter
- assertVisible: Browser Second Page
- tapOn:
    id: browser-address
- tapOn: Clear search
- inputText: http://127.0.0.1:18874/
- tapOn:
    id: browser-search-go
- assertVisible: Browser First Page
