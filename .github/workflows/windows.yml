name: Sloppy Windows

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.3.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build server, dashboard and node
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test fast development build workflow
        shell: powershell
        run: ./scripts/test-windows-dev.ps1
      - name: Test Windows background service lifecycle
        shell: powershell
        run: ./scripts/test-windows-service.ps1
      - name: Package Windows release with runtime DLLs
        shell: powershell
        run: ./scripts/package-windows.ps1 -OutputDirectory "${{ runner.temp }}/sloppy-release"
      - name: Test installation and runtime without development tools on PATH
        shell: powershell
        run: ./scripts/test-windows-release.ps1 -ArchivePath "${{ runner.temp }}/sloppy-release/Sloppy-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-portable-release
          path: ${{ runner.temp }}/sloppy-release/Sloppy-windows-x86_64.zip
          retention-days: 7
          if-no-files-found: ignore
      - name: Windows runtime regression tests
        shell: pwsh
        run: swift test --parallel --filter 'WindowsServiceTests|WindowsSupportTests|SloppyCLIParsingTests|LocalOwnerAuthTests|ProtocolsTests|AgentRuntimeTests|FoundationModelTransportTests|dashboardRuntimeConfig|dashboardHTTPServerKeepsLocalConsoleRequestsOnLoopback|consoleDashboardEndpointsRequireLocalOwnerAndRejectExternalOrigins'
      - name: Smoke server, dashboard and TUI
        shell: pwsh
        run: ./scripts/test-windows.ps1 -SkipBuild
      - name: Smoke Windows installation and server management
        shell: powershell
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-smoke-logs
          path: |
            .build/windows-smoke-*/**/*.log
            .build/windows-install-smoke-*/**/*.log
