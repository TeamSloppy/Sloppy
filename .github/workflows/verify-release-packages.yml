name: Verify release packages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release workflow run containing the built artifacts
        required: true
        type: string
      version:
        description: Expected CLI version
        required: true
        type: string
        default: 2.5.1

permissions:
  actions: read
  contents: read

jobs:
  windows-without-build-tree:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-node
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: package
      - name: Check package on a fresh runner without source build outputs
        shell: powershell
        run: ./scripts/test-windows-release.ps1 -ArchivePath package/Sloppy-windows-x86_64.zip -ExpectedVersion '${{ inputs.version }}'
