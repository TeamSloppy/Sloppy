<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title desc">
  <title id="title">Unified native agent loop in Sloppy</title>
  <desc id="desc">One model response, tool execution, durable results and one continuation decision. Recovery returns to request preparation. Settlement waits for recorded operation outcomes.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52604a" stroke-width="1.4"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #242521; }
      .title { font-size: 38px; font-weight: 650; letter-spacing: -1px; }
      .label { font-size: 23px; font-weight: 600; }
      .body { font-size: 19px; }
      .note { font-size: 18px; fill: #6d7066; }
      .node { fill: #f5f2e9; stroke: #52604a; stroke-width: 1.5; }
      .accent { fill: #c8e2ae; stroke: #52604a; stroke-width: 1.5; }
      .line { fill: none; stroke: #52604a; stroke-width: 1.8; marker-end: url(#arrow); }
      .dark { fill: #f5f2e9; }
    </style>
  </defs>
  <rect width="1280" height="1180" fill="#f5f2e9"/>
  <text x="58" y="63" class="title">Unified native agent loop</text>
  <text x="58" y="99" class="note">Target architecture of Sloppy · native runtime</text>
  <line x1="58" y1="122" x2="1222" y2="122" stroke="#d5d7ca"/>

  <rect x="385" y="150" width="500" height="78" class="node"/>
  <text x="635" y="182" text-anchor="middle" class="label">User task</text>
  <text x="635" y="211" text-anchor="middle" class="body">Model, mode, policies, userTurnID</text>
  <path d="M635 228V260" class="line"/>

  <rect x="385" y="260" width="500" height="94" class="accent"/>
  <text x="635" y="294" text-anchor="middle" class="label">Prepare request</text>
  <text x="635" y="324" text-anchor="middle" class="body">Journal projection, input queue, compaction</text>
  <path d="M635 354V389" class="line"/>

  <rect x="385" y="389" width="500" height="94" class="node"/>
  <text x="635" y="423" text-anchor="middle" class="label">One model response</text>
  <text x="635" y="453" text-anchor="middle" class="body">Text, tool calls, usage, stop reason</text>
  <path d="M635 483V520" class="line"/>

  <rect x="385" y="520" width="500" height="78" class="node"/>
  <text x="635" y="552" text-anchor="middle" class="label">Persist final model response</text>
  <text x="635" y="581" text-anchor="middle" class="body">Partial arguments are never executed</text>
  <path d="M635 598V632" class="line"/>

  <rect x="385" y="632" width="500" height="94" class="node"/>
  <text x="635" y="666" text-anchor="middle" class="label">Process tool batch</text>
  <text x="635" y="696" text-anchor="middle" class="body">If calls exist: access, approval, execution</text>
  <path d="M635 726V760" class="line"/>

  <rect x="385" y="760" width="500" height="78" class="node"/>
  <text x="635" y="792" text-anchor="middle" class="label">Persist results and evidence</text>
  <text x="635" y="821" text-anchor="middle" class="body">Preserve source order and call / result links</text>
  <path d="M635 838V873" class="line"/>

  <rect x="385" y="873" width="500" height="94" class="accent"/>
  <text x="635" y="907" text-anchor="middle" class="label">Make one decision</text>
  <text x="635" y="937" text-anchor="middle" class="body">Continue, recover or finalize</text>
  <path d="M385 920H285V307H385" class="line"/>
  <text x="74" y="885" class="label">Continue</text>
  <text x="74" y="915" class="body">Tools, steering</text>
  <text x="74" y="941" class="body">or completion recovery</text>

  <path d="M385 436H252" class="line"/>
  <text x="278" y="416" class="note">Failure</text>
  <rect x="58" y="389" width="194" height="108" class="node"/>
  <text x="155" y="423" text-anchor="middle" class="label">Recovery</text>
  <text x="155" y="453" text-anchor="middle" class="body">Reason and budget</text>
  <text x="155" y="479" text-anchor="middle" class="body">No effect replay</text>
  <path d="M155 389V307H385" class="line"/>

  <path d="M885 680H957" class="line"/>
  <text x="925" y="650" class="note">Stop</text>
  <rect x="957" y="680" width="265" height="155" class="node"/>
  <text x="1089" y="716" text-anchor="middle" class="label">Explicit outcome</text>
  <text x="1089" y="748" text-anchor="middle" class="body">Cancel, denial, limit,</text>
  <text x="1089" y="776" text-anchor="middle" class="body">waiting for input</text>
  <text x="1089" y="804" text-anchor="middle" class="body">or reconciliation</text>
  <path d="M1089 835V1050H885" class="line"/>

  <path d="M635 967V1003" class="line"/>
  <rect x="385" y="1003" width="500" height="94" fill="#20261e"/>
  <text x="635" y="1037" text-anchor="middle" class="label dark">Settle run</text>
  <text x="635" y="1067" text-anchor="middle" class="body dark">An accepted completion may render a tool-free answer</text>
  <text x="58" y="1140" class="note">Settled: operation outcomes are accounted for and required events are persisted.</text>
</svg>

